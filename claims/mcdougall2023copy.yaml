    - exact: We find that the median attention change is −0.09, with lower quartile −0.19.
      section: Appendix M.2
    - exact: this suggests that the effective embedding does not faithfully capture the model’s attention.
      section: Appendix M.2
  c3-convergent-validity:
    statement: '[C3 Convergent validity, status C] Convergent validity'
    verified: true
    quotes:
    - exact: We use the logit lens (nostalgebraist, 2020) technique to measure what intermediate model
        components predict, and use mean ablation to delete internal model activations.
      section: §2
    - exact: 1. In Section 3.1, we analyse the OV circuit, and show that the head suppresses the prediction
        of 84.70% of tokens which it attends to. 2. In Section 3.2, we analyse the QK circuit, and show
        that the head attends to the token which the model is currently predicting across 95.72% of the
        model’s vocabulary.
      section: §3
    - exact: 'Specifically, we sampled from the top 5% of completions where L10H7 had greatest effect
        as these accounted for half of the attention head’s loss reducing effect across the dataset. 80%
        of the sampled completions were examples of copy suppression when we operationalized the three
        qualitative copy suppression steps from Section 1 by three corresponding conditions:'
      section: §2.1
    - exact: In this section, we perform an ablation which deletes all functionality of L10H7’s OV and
        QK circuits, except for the mechanisms described in Section 3.1 and 3.2 respectively, with the
        goal of seeing how much functionality we can remove without damaging performance. We refer to
        this as Copy Suppression-Preserving Ablation (CSPA).
      section: §3.3
    - exact: 'We found that the results approximately matched our dynamic analysis (with slightly more
        noise): the proportion of (source, destination) token pairs where the source token was in the
        top 10 most suppressed tokens was 78.24% (which is close to the static analysis result of 84.70%).'
      section: Appendix F
    - exact: For example, head L10H7 in GPT-2 Small ranked higher than all other attention heads in both
        copy-suppression and negative induction score.
      section: Appendix A
