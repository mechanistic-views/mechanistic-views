  c5-nomological-validity:
    statement: '[C5 Nomological validity, status PC] Nomological validity'
    verified: true
    quotes:
    - exact: In this work we explain how “Negative Heads” (which include ‘negative name mover heads’ from
        Wang et al. (2023) and ‘anti-induction heads’ from Olsson et al. (2022)) function on the natural
        language training distribution in GPT-2 Small.
      section: §1
    - exact: Several works have found that transformer language model predictions are iteratively refined
        (Dar et al., 2022; nostalgebraist, 2020; Belrose et al., 2023; Halawi et al., 2023) in the sense
        that the state after intermediate layers forms a partial approximation to the final output, though
        no connections have yet been made to Negative Heads.
      section: §5
    - exact: This paper aimed to mechanistically explain what heads like L10H7 do, rather than to provide
        an explanation for why they form. We hope to address this in subsequent research. Here, we present
        three possible theories, present some evidence for/against them, and discuss how we might test
        them.
      section: Appendix E
    - exact: 'Tests: Examine the sequences for which this head decreases the loss by the most (particularly
        for checkpointed models, just as the negative head is forming).'
      section: Appendix E
