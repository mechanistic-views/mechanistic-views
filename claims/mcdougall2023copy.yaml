claims:
  c1-falsifiability:
    statement: '[C1 Falsifiability, status C] Falsifiability'
    verified: true
    quotes:
    - exact: 'We show that the main role of Negative Heads in GPT-2 Small is copy suppression (Figure
        1), which is defined by three steps:'
      section: §1
    - exact: 1. Prior copying. Language model components in early layers directly predict that the next
        token is one that already appears in context, e.g that the prefix “All’s fair in love and” is
        completed with “ love”. 2. Attention. Copy suppression heads detect the prediction of a copied
        token and attend back to the previous instance of this token (“ love”). 3. Suppression. Copy suppression
        heads write directly to the model’s output to decrease the logits on the copied token.
      section: §1
    - exact: 'Specifically, we sampled from the top 5% of completions where L10H7 had greatest effect
        as these accounted for half of the attention head’s loss reducing effect across the dataset. 80%
        of the sampled completions were examples of copy suppression when we operationalized the three
        qualitative copy suppression steps from Section 1 by three corresponding conditions:'
      section: §2.1
    - exact: 1. The model’s predictions at the input to L10H7 included a token which appeared in context
        as one of the top 10 most confident completions (as measured by the logit lens); 2. The source
        token was one of the top 2 tokens in context that L10H7 attended to most; 3. The 10 tokens that
        L10H7 decreased logits for the most included the source token.
      section: §2.1
    - exact: 'If L10H7 is suppressing the tokens that it attends to, then the diagonal elements of (1))
        will consistently be the most negative elements in their columns. This is what we find: 84.70%
        of the tokens in GPT-2 Small’s vocabulary have their diagonal elements as one of the top 10 most
        negative values in their columns, and 98.86% of tokens had diagonal elements in the bottom 5%.'
      section: §3.1
    - exact: Therefore we expect the largest elements of each row of Eqn. (2) to be the diagonal elements
        of this matrix. Indeed, in Figure 3 (orange bars) we find that 95.72% of diagonal values in this
        matrix were the largest in their respective rows.
      section: §3.2
  c2-structural-plausibility:
    statement: '[C2 Structural plausibility, status C] Structural plausibility'
    verified: true
    quotes:
    - exact: 'If L10H7 is suppressing the tokens that it attends to, then the diagonal elements of (1))
