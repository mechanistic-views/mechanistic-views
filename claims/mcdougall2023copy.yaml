    - exact: 'We found that the results approximately matched our dynamic analysis (with slightly more
        noise): the proportion of (source, destination) token pairs where the source token was in the
        top 10 most suppressed tokens was 78.24% (which is close to the static analysis result of 84.70%).'
      section: Appendix F
    - exact: However, one limitation of our analysis of the QK circuit is that this idealised setup does
        not completely faithfully represent L10H7’s real functioning (Appendices M.2, M.3 and N).
