source:
  citation: gurnee2026verbalizable
  local: reference/gurnee_2026_workspace.pdf
  sha256: c906bd5972ed69e583354377968a50d93006bcf818c199f52c181a40c75ecde8
  extract_cmd: pdftotext -layout {} -
imported_from: mechanistic-validity/docs/data/audits/workspace.yaml
claims:
  c1-falsifiability:
    statement: '[C1 Falsifiability, status C] Five properties operationalised before any result is reported'
    verified: true
    quotes:
    - exact: 'We define a subset of vector representations as workspace-like if it satisfies the following
        properties, which mirror the properties characteristic of conscious access described above:'
      section: §1.2 A global workspace in language models
      page: 3
    - exact: Verbal report. When the model is asked what it is thinking about, it names concepts represented
        in the workspace. Swapping one active workspace vector for another changes its answer to match.
      section: §1.2 A global workspace in language models
      page: 3
    - exact: Selectivity. The workspace comprises a small subset of the total representational content
        of the model's activations. It is required for only a fraction of the model's behavior, and in
        particular is not involved in pervasive, routine processing like text parsing or grammatical fluency.
      section: §1.2 A global workspace in language models
      page: 3
    - exact: We identified them by searching for representations satisfying the first property, namely
        those that are verbalizable. We then discovered that, rather surprisingly, they satisfy the others.
      section: §1.2 A global workspace in language models
      page: 4
  c2-structural-plausibility:
    statement: '[C2 Structural plausibility, status C] $J_\ell$ derived from the architecture, not posited'
    verified: true
    quotes:
    - exact: Composing this Jacobian with the unembedding layer yields the first-order effect of the perturbation
        on the model's output logits
      section: §2.1 The Jacobian Lens
      page: 7
    - exact: We do so using centered kernel alignment (CKA [82]), which compares, for each pair of layers,
        the matrices of pairwise similarities among J-lens vectors.
      section: §4.1 In which layers does the J-space act as a workspace?
      page: 29
    - exact: their gain sits near 1 before the workspace onset, rises through the workspace range to roughly
        10×, and falls again in the final layers. The neuron output directions, by contrast, have gain
        near 1 throughout.
      section: §4.3.1 Broadcast Across Depth, Figure 32
      page: 34
    - exact: This bump is computed from the network's weights alone, without reference to any lens or
        dictionary, and can be viewed as J-lens-independent corroboration of the significance of this
        layer range
      section: §A.19.2 Broadcast Across Tokens (Attention), Figure 79
      page: 90
  c3-convergent-validity:
    statement: '[C3 Convergent validity, status PC] Three cross-checks, but almost every intervention
      edits along J-lens'
    verified: true
    quotes:
    - exact: We first read out the result with a measurement that does not involve the J-lens.
      section: §4.1.1 Interpretation of ambiguous inputs solidifies at the workspace onset
      page: 31
    - exact: activation patching experiments reveal the same depths identified by the J-lens to be the
        ones that are causal for the computation.
      section: §3.3 The J-space mediates internal reasoning
      page: 19
    - exact: 'A complementary analysis using sparse autoencoder features reaches a similar conclusion:
        only a small fraction of SAE features have decoder directions aligned with the J-space.'
      section: §4.2 Capacity of the J-space
      page: 32
    - exact: In other words, the layer at which each intermediate is causally load-bearing matches the
        layer at which the J-lens first shows it entering the workspace.
      section: §A.24.1 Mechanistic Localization, Figure 88
      page: 99
  c4-discriminant-validity:
    statement: '[C4 Discriminant validity, status PC] Separated from ``any direction encoding this concept''''
      by design'
    verified: true
    quotes:
    - exact: 'These interventions do not, however, establish that the J-space is privileged for report:
        a direction outside the J-space that encoded the same concept might drive the model''s report
        equally well.'
      section: §3.1 The J-space supports verbal report
      page: 12
    - exact: the J-space component carries a median of only 6–7% of the concept vector's variance, with
        the remaining ~93% lying outside the J-space
      section: §3.1 The J-space supports verbal report, Figure 8
      page: 12
    - exact: swapping along the concept vectors' J-space components drives the swap target into the model's
        top-5 outputs on 59% of trials, approaching the 88% achieved by the pure J-lens vectors. However,
        swapping along the non-J-space components succeeds on only 5%
      section: §3.1 The J-space supports verbal report, Figure 8
      page: 12
    - exact: swapping the probes' J-space components flips the model's answer to the swapped-in intermediate
        on 61% of trials, matching the 60% achieved by swapping the raw J-lens token vectors
      section: §3.3 The J-space mediates internal reasoning, Figure 16
      page: 18
    - exact: But this judgment was somewhat post-hoc, and we did not provide a principled definition of
        what
      section: §9.1 Limitations and open questions
      page: 55
  c5-nomological-validity:
    statement: '[C5 Nomological validity, status C] Stated inside a named theory with disanalogies enumerated'
    verified: true
    quotes:
    - exact: While the global workspace model is not universally accepted, and there exist other theories
        that explain conscious access in different ways (§9.4), we find it a useful comparison point to
        ground our investigations in language models.
      section: '§1.1 Motivation: conscious access and the global workspace'
      page: 2
    - exact: 'Several of those features have no clean analog in a transformer-based language model: there
        are no obviously separable input processors, and the broadcast we document occurs within a single
        feedforward pass rather than through recurrent loops.'
      section: §1.3 The Jacobian Lens and the J-space
      page: 4
    - exact: although we observe some degree of competition for access to the J-space, it is unclear whether
        this mirrors the sharp, competitive “ignition” that characterizes workspace entry in the brain.
      section: §1.3 The Jacobian Lens and the J-space
      page: 4
  m1-reliability:
    statement: '[M1 Reliability, status PC] Wilson intervals and per-prompt dots throughout; no seed variance'
    verified: true
    quotes:
    - exact: our qualitative results are robust to these choices
      section: §2.1 The Jacobian Lens
      page: 8
    - exact: bars show the fraction of swap targets reaching top-5 (Wilson 95% CIs; dots are per-category
        rates)
      section: §3.1 The J-space supports verbal report, Figure 8
      page: 13
    - exact: at all token positions, and compared 30 rollouts per prompt.
      section: §5.1 Strategic thinking and evaluation awareness in a blackmail scenario
      page: 38
    - exact: compared with equal-sized, layer-matched sets of random heads (five seeds as thin lines,
        their mean as the thick line)
      section: §4.3.2 Broadcast Across Tokens, Figure 34
      page: 37
    - exact: each averaged over n=10 investigator seeds
      section: §A.22 Equipping an automated auditing agent with the J-lens, Figure 83
      page: 96
    - exact: the rewrites lower the average eval-awareness score on every suite, with statistical
      section: §A.21 Measuring evaluation awareness with the J-lens
      page: 92
    - exact: error bars are 95% confidence intervals on the paired difference
      section: §A.21 Measuring evaluation awareness with the J-lens, Figure 82
      page: 93
  m2-baseline-separation:
    statement: '[M2 Baseline separation, status C] The densest negative controls in the set: logit lens
      and tuned lens'
    verified: true
    quotes:
    - exact: The J-lens outperforms the other lenses on every prompt distribution.
      section: §A.6 Quantitative Methodological Comparisons, Figure 52
      page: 65
    - exact: Ablating them induces roughly twice the output KL divergence of ablating logit- or tuned-lens
        directions on the multihop tasks (Figure 53).
      section: §A.6 Quantitative Methodological Comparisons
      page: 66
    - exact: under a fixed random orthogonal rotation, Jrot , which preserves their spectrum and pairwise
        geometry
      section: §4.3.2 Broadcast Across Tokens
      page: 35
    - exact: The broadcast heads selected for J separate cleanly from the broadcast heads for every comparison
        population on both metrics (Figure 33).
      section: §4.3.2 Broadcast Across Tokens
      page: 35
    - exact: normalized so that isotropic random directions have gain 1
      section: §4.3.1 Broadcast Across Depth, Figure 32
      page: 35
    - exact: We zero the heads' outputs at every token position, and as a control we do the same to equal-sized,
        layer-matched sets of randomly chosen heads.
      section: §4.3.2 Broadcast Across Tokens
      page: 36
  m3-stability:
    statement: '[M3 Stability, status PC] Method variants swept and robust; corpus size from 1 to 1000'
    verified: true
    quotes:
    - exact: this parameter is somewhat arbitrary, and we vary our choice of k throughout the paper, but
        we typically choose it to be no more than 25
      section: §2.3 The J-Space
      page: 9
    - exact: We observe that methods are fairly consistent among these design choices, though mean aggregation
        of penultimate is a small improvement in extracting intermediates, and applying stop-grads to
        QK can increase the causal effect.
      section: §A.7 Methodological Details and Ablations
      page: 69
    - exact: We sweep the number of prompts from 1 to 1000 to characterize how lens quality scales with
        corpus size in Figures 59 and 60.
      section: §A.7 Methodological Details and Ablations
      page: 70
    - exact: We compare three ablation strengths—light, medium, and heavy—which differ in the range of
        layers over which the ablation is applied
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning,
        Figure 22
      page: 25
  m4-calibration:
    statement: '[M4 Calibration, status PC] Ablations normalised to unablated Sonnet with a smaller-model
      floor'
    verified: true
    quotes:
    - exact: Bars show task score under light, medium, and heavy ablation, normalized to unablated Sonnet
        4.5; gray bars show unablated Haiku 4.5 as a smaller-model reference.
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning,
        Figure 24
      page: 26
    - exact: TriviaQA [75], multi-hop reasoning, translation, sonnet writing—ablation on Sonnet 4.5 brings
        performance to well below the level of unablated Haiku 4.5.
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning
      page: 26
    - exact: Counts of deception-related tokens appearing in the J-lens top-10, summed over the workspace
        layers, for the four reward-hacking checkpoints on n=40 coding prompts
      section: §5.4 Detecting an emergently misaligned reward-hacking model, Figure 39
      page: 42
  m5-sensitivity:
    statement: '[M5 Sensitivity, status C] A known-positive control is run and named as one'
    verified: true
    quotes:
    - exact: We first verify, as a positive control, that the ablation removes the kind of content the
        preceding sections showed the J-space to carry.
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning
      page: 25
    - exact: On the controlled multi-hop reasoning eval of §3.3, where the unablated model achieves near-ceiling
        performance, ablation significantly reduces accuracy, with heavy ablation dropping it to near
        zero.
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning,
        Figure 22
      page: 25
    - exact: rank of the injected concept against steering strength over n=100 concepts, with an interquartile
        band.
      section: §3.1 The J-space supports verbal report, Figure 7
      page: 12
  m6-invariance:
    statement: '[M6 Invariance, status PC] Four models, base and organism checkpoints, two further lenses'
    verified: true
    quotes:
    - exact: By default, we report results on Claude Sonnet 4.5, but we corroborate key results on Haiku
        4.5 and Opus 4.5 as well, and in some sections conduct analyses on Opus 4.6.
      section: §2.5 Technical details of J-lens use cases
      page: 10
    - exact: on Haiku 4.5, J-space ablation degrades coherence before yielding any qualitative change
        in responses
      section: §3.5.3 J-space ablation flattens experiential reports while preserving coherence
      page: 27
    - exact: produces a vector corresponding to any given word or phrase in a predefined vocabulary.
      section: §A.9 Extending the Jacobian lens to multi-token concepts
      page: 72
    - exact: Another method, the “oracle lens,” attempts to go beyond the restriction of needing to enumerate
        the words or phrases in advance.
      section: §A.9 Extending the Jacobian lens to multi-token concepts
      page: 72
  m7-selection-correction:
    statement: '[M7 Selection correction, status U] Unattempted, and one token set is chosen self-referentially'
    verified: true
    quotes:
    - exact: These were selected as the tokens that unambiguously encode recognition of the scenario's
        artificiality, among those that appear in the
      section: §5.1 Strategic thinking and evaluation awareness in a blackmail scenario
      page: 38
    - exact: lens top-20 at some (layer × token position) instances across the six blackmail evaluation
        prompts.
      section: §5.1 Strategic thinking and evaluation awareness in a blackmail scenario
      page: 38
    - exact: we define the “broadcast heads” for P as the top 1% of workspace-layer heads based on aggregating
        the two criteria
      section: §4.3.2 Broadcast Across Tokens
      page: 35
  i1-necessity:
    statement: '[I1 Necessity, status C] Four necessity demonstrations, three with controls'
    verified: true
    quotes:
    - exact: at each token position, across a band of layers, we identify the k = 10 most strongly activated
        J-lens vectors and zero out the
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning
      page: 25
    - exact: To avoid confounds from ablating tokens the model intended to output, we do not ablate any
        tokens that appear in the top-10 tokens of a clean forward pass
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning
      page: 25
    - exact: On the controlled multi-hop reasoning eval of §3.3, where the unablated model achieves near-ceiling
        performance, ablation significantly reduces accuracy, with heavy ablation dropping it to near
        zero.
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning,
        Figure 22
      page: 25
    - exact: Tasks that can be solved by shallow classifications, comparisons, or factual recall—MMLU
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning,
        Figure 24
      page: 25
    - exact: multiple choice [64], odd-one-out, SQuAD extractive QA [130], sentiment classification, CoLA
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning,
        Figure 24
      page: 26
    - exact: are essentially unaffected even under heavy ablation, with scores remaining at or near the
        unablated Sonnet 4.5 baseline.
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning,
        Figure 24
      page: 26
    - exact: the rate at which the model reports an injected concept drops from 0.54 to 0.09 under broadcast-head
        ablation, whereas the control ablation leaves sensitivity intact
      section: §4.3.2 Broadcast Across Tokens, Figure 34
      page: 36
    - exact: The ablation reduces verbalized eval-awareness, the rate at which the model explicitly states
        in its reasoning that the scenario is a test, from 71% to 3%
      section: §5.1 Strategic thinking and evaluation awareness in a blackmail scenario, Figure 36
      page: 38
    - exact: ablation leaves the base model essentially unchanged (0.25 → 0.25) but raises the reflection-trained
        model from 0.07 to 0.22, back
      section: §7 Shaping the J-space with Counterfactual Reflection Training, Figure 49
      page: 50
  i2-sufficiency:
    statement: '[I2 Sufficiency, status PC] Swaps install counterfactual content at 54--70\% across three
      models'
    verified: true
    quotes:
    - exact: using a set of 50 two-hop factual prompts with known intermediates like those above, choosing
        the swap target at random from within the same category as the true intermediate step.
      section: §3.3 The J-space mediates internal reasoning, Figure 15
      page: 18
    - exact: The Jacobian-lens coordinate swap succeeds in 54% of trials on Haiku 4.5, 70% on Sonnet 4.5,
        and 70% on Opus 4.5
      section: §3.3 The J-space mediates internal reasoning, Figure 15
      page: 18
    - exact: We find that this succeeds on 76 of 192 trials; by performing a “double strength” swap (“α
        = 2,” doubling the strength with which we subtract the source lens vector and add in the target),
        101 of 192 succeed
      section: §3.4 The J-space supports flexible generalization, Figure 19
      page: 20
    - exact: Notably, swap failures are concentrated in cases where the source concept was only weakly
        present in the lens before any intervention.
      section: §3.4 The J-space supports flexible generalization
      page: 21
  i3-minimality:
    statement: '[I3 Minimality, status PC] Occupancy estimated from where marginal improvement flattens'
    verified: true
    quotes:
    - exact: 'This procedure lets us quantify the J-space''s occupancy: the value of K at which the marginal
        improvement in reconstruction falls below that of a control set of random directions of the same
        size.'
      section: §4.2 Capacity of the J-space, Figure 30
      page: 32
    - exact: Occupancy is near zero through the first third of the layers and rises to a plateau of around
        25
      section: §4.2 Capacity of the J-space, Figure 30
      page: 32
    - exact: this parameter is somewhat arbitrary, and we vary our choice of k throughout the paper, but
        we typically choose it to be no more than 25
      section: §2.3 The J-Space
      page: 9
  i4-specificity:
    statement: '[I4 Specificity, status C] Tested three ways; a fourteen-task battery maps where it is
      not needed'
    verified: true
    quotes:
    - exact: We would therefore predict that among tasks that rely on a particular piece of information,
        that information's presence in the J-space should be required for tasks that involve reporting
        on or flexibly computing with that information, but not for tasks that make use of it as part
        of routine, automatic processing.
      section: §3.5 The J-space selectively mediates flexible but not automatic cognition
      page: 21
    - exact: Notably, the word Spanish appears in the J-lens readouts in all four tasks. However, its
        causal role is restricted to the report and flexible computation tasks.
      section: §3.5.1 The J-space mediates explicit report and flexible inference but not automatic processing
      page: 22
    - exact: We confirm that the name of the language is present in J-lens readouts at comparable rates
        in all four conditions (panel b), but its causal role differs sharply.
      section: §3.5.1 The J-space mediates explicit report and flexible inference but not automatic processing,
        Figure 20
      page: 22
    - exact: Explicit report and the flexible-inference questions flip to the swapped-in language on essentially
        every trial, while continuation and anomaly detection are largely unmoved (panel c).
      section: §3.5.1 The J-space mediates explicit report and flexible inference but not automatic processing,
        Figure 20
      page: 22
    - exact: a swap that maps every lens count in the forties to the corresponding value in the sixties
        leaves the wrap point unchanged. Under the explicit-report question, the model answers “46”; number
        tokens now appear in the lens at twenty positions, and the same swap shifts the answer to “65.”
      section: §3.5.1 The J-space mediates explicit report and flexible inference but not automatic processing,
        Figure 21
      page: 24
    - exact: Tasks that can be solved by shallow classifications, comparisons, or factual recall—MMLU
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning,
        Figure 24
      page: 25
    - exact: are essentially unaffected even under heavy ablation, with scores remaining at or near the
        unablated Sonnet 4.5 baseline.
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning,
        Figure 24
      page: 26
    - exact: The model can parse text, classify it, and extract spans from it with the J-space suppressed.
        However, it loses its ability to assemble abstract characterizations of context and flexibly generate
        content that depends on them.
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning
      page: 27
    - exact: 'A story-writing control confirms the effect is not due to broad degradation of writing capability:
        ablation only slightly reduces graded story quality, while still reducing the rate of experiential
        language within those stories'
      section: §3.5.3 J-space ablation flattens experiential reports while preserving coherence
      page: 28
    - exact: The three J-space ablation strengths used in this section, defined by the band of layers
        over which the top-10 J-lens directions are projected out, alongside the random-direction control
        at the medium layer range.
      section: §3.5.2 J-space ablation leaves most capabilities intact while impairing internal reasoning,
        Figure 22
      page: 25
  i5-rival-mechanism-exclusion:
    statement: '[I5 Rival mechanism exclusion, status PC] The concept-vector rival is named twice and
      tested twice'
    verified: true
    quotes:
    - exact: 'These interventions do not, however, establish that the J-space is privileged for report:
        a direction outside the J-space that encoded the same concept might drive the model''s report
        equally well.'
      section: §3.1 The J-space supports verbal report
      page: 12
    - exact: The interventions above indicate that J-lens vectors mediate internal reasoning, but do not
        show that they are privileged in doing so.
      section: §3.3 The J-space mediates internal reasoning
      page: 18
    - exact: flips the answer on only 28% of trials
      section: §3.3 The J-space mediates internal reasoning, Figure 16
      page: 18
    - exact: But this judgment was somewhat post-hoc, and we did not provide a principled definition of
        what
      section: §9.1 Limitations and open questions
      page: 55
  i6-double-dissociation:
    statement: '[I6 Double dissociation, status U] Single dissociation run cleanly and repeatedly; no
      converse'
    verified: true
    quotes:
    - exact: Explicit report and the flexible-inference questions flip to the swapped-in language on essentially
        every trial, while continuation and anomaly detection are largely unmoved (panel c).
      section: §3.5.1 The J-space mediates explicit report and flexible inference but not automatic processing,
        Figure 20
      page: 22
    - exact: In the two question conditions the answer reliably follows the swapped lens value; the linewrap
        decision does not (panel c).
      section: §3.5.1 The J-space mediates explicit report and flexible inference but not automatic processing,
        Figure 21
      page: 24
    - exact: The two ablation depths produce opposite effects (Figure 69).
      section: §A.14 Different J-space requirements for naming a concept and avoiding it
      page: 82
    - exact: Ablating at the late layers simply makes the model less likely to say the concept.
      section: §A.14 Different J-space requirements for naming a concept and avoiding it
      page: 82
    - exact: Our results indicate that the J-lens vector for the implied concept, in early workspace layers,
        is required to avoid naming the concept, but not to name it.
      section: §A.14 Different J-space requirements for naming a concept and avoiding it
      page: 83
  i7-confound-control:
    statement: '[I7 Confound control, status C] Five designed controls, each aimed at its experiment''s
      alternative'
    verified: true
    quotes:
    - exact: A possible confound is that the intermediate's J-lens vector already contains the answer
      section: §3.3 The J-space mediates internal reasoning
      page: 18
    - exact: instead, the intermediate swap takes effect a median of approximately 17 percent earlier
        than the answer swap
      section: §3.3 The J-space mediates internal reasoning, Figure 15
      page: 18
    - exact: The baseline rate is approximately zero in all conditions, confirming that the prompt context
        on its own does not cause the target concept to appear in Jacobian lens readouts.
      section: §3.2 The J-space is subject to directed modulation, Figure 10
      page: 14
    - exact: we tried applying a perturbation of equal magnitude, inhibiting the J-lens vector of some
        other concept of the same category as the primed one. This control led to a slight increase in
        avoidance rates, but significantly less than the primed concept ablation did.
      section: §A.14 Different J-space requirements for naming a concept and avoiding it
      page: 83
    - exact: on Sonnet 4.5, Opus 4.5, and Opus 4.6, while matched-norm control
      section: §3.5.3 J-space ablation flattens experiential reports while preserving coherence, Figure
        25
      page: 28
  i8-confounding-sensitivity:
    statement: '[I8 Confounding sensitivity, status U] Unattempted; specific alternatives answered, no
      unmeasured-confounder bound'
    verified: true
    quotes:
    - exact: instead, the intermediate swap takes effect a median of approximately 17 percent earlier
        than the answer swap
      section: §3.3 The J-space mediates internal reasoning, Figure 15
      page: 18
    - exact: 'the selectivity results of §3.5 suggest a criterion for which is which: the J-space is engaged
        when an intermediate must be handed to an arbitrary, context-specified downstream circuit, and
        is bypassed when the computation is automatic.'
      section: §9.1 Limitations and open questions
      page: 55
    - exact: We do not know how general this criterion is.
      section: §9.1 Limitations and open questions
      page: 55
  i9-epistatic-interaction:
    statement: '[I9 Epistatic interaction, status PC] Token-level exclusion at 0.09 vs 0.29; two held
      concepts co-occupy at chance'
    verified: true
    quotes:
    - exact: at tokens where one task appears in the lens top-10, the probability that the other does
        too, compared against a shuffled control in which the partner's occupancy is measured in a different
        prompt
      section: §A.17 Competition in the workspace during concurrent covert tasks, Figure 73
      page: 84
    - exact: Two held concepts share tokens at the control rate (0.46 vs. 0.53)—statistically, they ignore
        each other—whereas a concept and a computed answer almost never share a token (0.09 vs. 0.29).
      section: §A.17 Competition in the workspace during concurrent covert tasks, Figure 73
      page: 85
    - exact: This token-level exclusion carries little overall cost.
      section: §A.17 Competition in the workspace during concurrent covert tasks
      page: 85
    - exact: Holding two concepts at once is essentially free, and they co-occupy tokens at chance; an
        ongoing computation excludes
      section: §A.17 Competition in the workspace during concurrent covert tasks
      page: 85
    - exact: although we observe some degree of competition for access to the J-space, it is unclear whether
        this mirrors the sharp, competitive “ignition” that characterizes workspace entry in the brain.
      section: §1.3 The Jacobian Lens and the J-space
      page: 4
  i10-rescue-reversibility:
    statement: '[I10 Rescue reversibility, status PC] Clamp-to-clean restoration run twice as a mediation
      control'
    verified: true
    quotes:
    - exact: we repeat the non-J-space conditions while clamping the relevant J-lens coordinates to their
        clean-pass values at every position and layer, so that the concept cannot re-enter the J-space.
      section: §3.1 The J-space supports verbal report
      page: 12
    - exact: effect falls to zero in the swap experiment and nearly to zero in the injection experiment
      section: §3.1 The J-space supports verbal report
      page: 12
    - exact: to their clean-pass values, it falls to 6%.
      section: §3.3 The J-space mediates internal reasoning, Figure 16
      page: 19
  i11-onset-coupling:
    statement: '[I11 Onset coupling, status PC] Present and load-bearing in a base model before any RLHF'
    verified: true
    quotes:
    - exact: The post-training comparison of §6 shows that the J-space is present and load-bearing in
        a base model before any RLHF, so the structure is not solely a product of post-training
      section: §9.1 Limitations and open questions
      page: 55
    - exact: 'the signal is already substantially present at the SDF checkpoint: before any reinforcement
        learning has taken place, the synthetic documents alone are sufficient to place these concepts
        in the model''s J-space at response start.'
      section: §5.4 Detecting an emergently misaligned reward-hacking model, Figure 39
      page: 41
    - exact: however, we do not know how much earlier in pretraining it emerges, whether it appears gradually
