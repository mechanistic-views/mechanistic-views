<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 195" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .title { font-size: 14px; font-weight: 600; fill: #1e293b; }
      .subtitle { font-size: 11px; fill: #64748b; }
      .number { font-size: 18px; font-weight: 700; }
      .tagline { font-size: 12px; fill: #94a3b8; font-style: italic; }
    </style>
  </defs>

  <!-- Connecting arrows -->
  <line x1="121" y1="82" x2="148" y2="82" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="146,78 154,82 146,86" fill="#cbd5e1"/>
  <line x1="249" y1="82" x2="276" y2="82" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="274,78 282,82 274,86" fill="#cbd5e1"/>
  <line x1="377" y1="82" x2="404" y2="82" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="402,78 410,82 402,86" fill="#cbd5e1"/>
  <line x1="505" y1="82" x2="532" y2="82" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="530,78 538,82 530,86" fill="#cbd5e1"/>

  <!-- 1: Ontology (purple) -->
  <rect x="59" y="51" width="62" height="62" rx="10" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="59" y="51" width="62" height="62" rx="10" fill="#7c3aed" fill-opacity="0.06"/>
  <text x="90" y="88" text-anchor="middle" class="number" fill="#7c3aed">1</text>
  <text x="90" y="32" text-anchor="middle" class="title">Ontology</text>
  <text x="90" y="134" text-anchor="middle" class="subtitle">What kind of thing</text>
  <text x="90" y="148" text-anchor="middle" class="subtitle">is a mechanism?</text>

  <!-- 2: Identity (blue) -->
  <rect x="187" y="51" width="62" height="62" rx="10" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="187" y="51" width="62" height="62" rx="10" fill="#3b82f6" fill-opacity="0.06"/>
  <text x="218" y="88" text-anchor="middle" class="number" fill="#3b82f6">2</text>
  <text x="218" y="32" text-anchor="middle" class="title">Identity</text>
  <text x="218" y="134" text-anchor="middle" class="subtitle">When are two</text>
  <text x="218" y="148" text-anchor="middle" class="subtitle">the same?</text>

  <!-- 3: Evidence (teal) -->
  <rect x="315" y="51" width="62" height="62" rx="10" fill="none" stroke="#14b8a6" stroke-width="2.5"/>
  <rect x="315" y="51" width="62" height="62" rx="10" fill="#14b8a6" fill-opacity="0.06"/>
  <text x="346" y="88" text-anchor="middle" class="number" fill="#14b8a6">3</text>
  <text x="346" y="32" text-anchor="middle" class="title">Evidence</text>
  <text x="346" y="134" text-anchor="middle" class="subtitle">What warrants</text>
  <text x="346" y="148" text-anchor="middle" class="subtitle">the claim?</text>

  <!-- 4: Formalism (amber) -->
  <rect x="443" y="51" width="62" height="62" rx="10" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="443" y="51" width="62" height="62" rx="10" fill="#f59e0b" fill-opacity="0.06"/>
  <text x="474" y="88" text-anchor="middle" class="number" fill="#f59e0b">4</text>
  <text x="474" y="32" text-anchor="middle" class="title">Formalism</text>
  <text x="474" y="134" text-anchor="middle" class="subtitle">What math</text>
  <text x="474" y="148" text-anchor="middle" class="subtitle">formalizes it?</text>

  <!-- 5: Target (rose) -->
  <rect x="571" y="51" width="62" height="62" rx="10" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
  <rect x="571" y="51" width="62" height="62" rx="10" fill="#f43f5e" fill-opacity="0.06"/>
  <text x="602" y="88" text-anchor="middle" class="number" fill="#f43f5e">5</text>
  <text x="602" y="32" text-anchor="middle" class="title">Target</text>
  <text x="602" y="134" text-anchor="middle" class="subtitle">What phenomenon</text>
  <text x="602" y="148" text-anchor="middle" class="subtitle">is it about?</text>

  <!-- Tagline -->
  <text x="346" y="185" text-anchor="middle" class="tagline">A mechanistic view is a coherent bundle of answers to these five questions.</text>
</svg>
