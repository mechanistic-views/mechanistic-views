<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 810" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .col-header { font-size: 14px; font-weight: 700; fill: #1e293b; text-transform: uppercase; letter-spacing: 1px; }
      .fam-label { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; }
      .card-name { font-size: 13px; font-weight: 600; fill: #1e293b; }
      .card-desc { font-size: 10.5px; fill: #475569; font-weight: 500; }
    </style>
  </defs>

  <!-- Column headers -->
  <text x="150" y="24" text-anchor="middle" class="col-header">Ontology</text>
  <text x="405" y="24" text-anchor="middle" class="col-header">Identity</text>
  <text x="655" y="24" text-anchor="middle" class="col-header">Formalism</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- 1. Analyst-choice — Stratified (top, highest commitment) -->
  <!-- ══════════════════════════════════════════════════════ -->

  <rect x="40" y="48" width="220" height="68" rx="12" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.4" stroke-width="2"/>
  <text x="150" y="42" text-anchor="middle" class="fam-label" fill="#6366f1">Analyst-choice</text>
  <rect x="55" y="60" width="190" height="44" rx="8" fill="white" fill-opacity="0.55" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="150" y="78" text-anchor="middle" class="card-name">Stratified</text>
  <text x="150" y="94" text-anchor="middle" class="card-desc">strata with varying identity</text>

  <rect x="295" y="60" width="220" height="44" rx="8" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="405" y="78" text-anchor="middle" class="card-name">Stratum-local equivalence</text>
  <text x="405" y="94" text-anchor="middle" class="card-desc">criterion varies locally</text>

  <rect x="545" y="60" width="220" height="44" rx="8" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="655" y="78" text-anchor="middle" class="card-name">Whitney stratification</text>
  <text x="655" y="94" text-anchor="middle" class="card-desc">strata, transversality</text>

  <line x1="245" y1="82" x2="295" y2="82" stroke="#6366f1" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="515" y1="82" x2="545" y2="82" stroke="#6366f1" stroke-opacity="0.4" stroke-width="2"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- 2. Process family (singleton)                         -->
  <!-- ══════════════════════════════════════════════════════ -->

  <rect x="40" y="140" width="220" height="68" rx="12" fill="#14b8a6" fill-opacity="0.08" stroke="#14b8a6" stroke-opacity="0.4" stroke-width="2"/>
  <text x="150" y="134" text-anchor="middle" class="fam-label" fill="#14b8a6">Process</text>
  <rect x="55" y="152" width="190" height="44" rx="8" fill="white" fill-opacity="0.55" stroke="#14b8a6" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="150" y="170" text-anchor="middle" class="card-name">Process</text>
  <text x="150" y="186" text-anchor="middle" class="card-desc">formation trajectories</text>

  <rect x="295" y="152" width="220" height="44" rx="8" fill="#14b8a6" fill-opacity="0.08" stroke="#14b8a6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="405" y="170" text-anchor="middle" class="card-name">Dynamical-basin membership</text>
  <text x="405" y="186" text-anchor="middle" class="card-desc">same formation attractor</text>

  <rect x="545" y="152" width="220" height="44" rx="8" fill="#14b8a6" fill-opacity="0.08" stroke="#14b8a6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="655" y="170" text-anchor="middle" class="card-name">Dynamical systems</text>
  <text x="655" y="186" text-anchor="middle" class="card-desc">phase portraits, attractors</text>

  <line x1="245" y1="174" x2="295" y2="174" stroke="#14b8a6" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="515" y1="174" x2="545" y2="174" stroke="#14b8a6" stroke-opacity="0.4" stroke-width="2"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- 3. Mathematical family (Structural + Subspace)        -->
  <!-- ══════════════════════════════════════════════════════ -->

  <rect x="40" y="232" width="220" height="130" rx="12" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2"/>
  <text x="150" y="226" text-anchor="middle" class="fam-label" fill="#3b82f6">Mathematical</text>

  <rect x="55" y="244" width="190" height="44" rx="8" fill="white" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="150" y="262" text-anchor="middle" class="card-name">Structural</text>
  <text x="150" y="278" text-anchor="middle" class="card-desc">invariant weight structure</text>

  <rect x="55" y="306" width="190" height="44" rx="8" fill="white" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="150" y="324" text-anchor="middle" class="card-name">Subspace</text>
  <text x="150" y="340" text-anchor="middle" class="card-desc">causal subspaces on Gr(k, d)</text>

  <rect x="295" y="244" width="220" height="44" rx="8" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="405" y="262" text-anchor="middle" class="card-name">Gauge-orbit membership</text>
  <text x="405" y="278" text-anchor="middle" class="card-desc">symmetry g · x = y</text>

  <rect x="295" y="306" width="220" height="44" rx="8" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="405" y="324" text-anchor="middle" class="card-name">Subspace proximity</text>
  <text x="405" y="340" text-anchor="middle" class="card-desc">Gr(k, d) geodesic distance &lt; θ</text>

  <rect x="545" y="244" width="220" height="44" rx="8" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="655" y="262" text-anchor="middle" class="card-name">Fiber bundles</text>
  <text x="655" y="278" text-anchor="middle" class="card-desc">parallel transport, holonomy</text>

  <rect x="545" y="306" width="220" height="44" rx="8" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="655" y="324" text-anchor="middle" class="card-name">Grassmannian</text>
  <text x="655" y="340" text-anchor="middle" class="card-desc">Gr(k, d), geodesics, projections</text>

  <line x1="245" y1="266" x2="295" y2="266" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="515" y1="266" x2="545" y2="266" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="245" y1="328" x2="295" y2="328" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="515" y1="328" x2="545" y2="328" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- 4. Identity family (Role + Object)                    -->
  <!-- ══════════════════════════════════════════════════════ -->

  <rect x="40" y="386" width="220" height="130" rx="12" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="2"/>
  <text x="150" y="380" text-anchor="middle" class="fam-label" fill="#7c3aed">Identity</text>

  <rect x="55" y="398" width="190" height="44" rx="8" fill="white" fill-opacity="0.55" stroke="#7c3aed" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="150" y="416" text-anchor="middle" class="card-name">Role</text>
  <text x="150" y="432" text-anchor="middle" class="card-desc">functional role in computation</text>

  <rect x="55" y="460" width="190" height="44" rx="8" fill="white" fill-opacity="0.55" stroke="#7c3aed" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="150" y="478" text-anchor="middle" class="card-name">Object</text>
  <text x="150" y="494" text-anchor="middle" class="card-desc">concrete parts: heads, neurons</text>

  <rect x="295" y="398" width="220" height="44" rx="8" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="405" y="416" text-anchor="middle" class="card-name">Role equivalence</text>
  <text x="405" y="432" text-anchor="middle" class="card-desc">same functional I/O mapping</text>

  <rect x="295" y="460" width="220" height="44" rx="8" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="405" y="478" text-anchor="middle" class="card-name">Component overlap</text>
  <text x="405" y="494" text-anchor="middle" class="card-desc">same parts identified</text>

  <rect x="545" y="398" width="220" height="44" rx="8" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="655" y="416" text-anchor="middle" class="card-name">Functional decomposition</text>
  <text x="655" y="432" text-anchor="middle" class="card-desc">role specifications, I/O contracts</text>

  <rect x="545" y="460" width="220" height="44" rx="8" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="655" y="478" text-anchor="middle" class="card-name">Directed graphs</text>
  <text x="655" y="494" text-anchor="middle" class="card-desc">computational graphs, causal abstraction</text>

  <line x1="245" y1="420" x2="295" y2="420" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="515" y1="420" x2="545" y2="420" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="245" y1="482" x2="295" y2="482" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="515" y1="482" x2="545" y2="482" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="2"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- 5. Analyst-choice — Perspectival + Contrastive        -->
  <!-- ══════════════════════════════════════════════════════ -->

  <rect x="40" y="540" width="220" height="130" rx="12" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.4" stroke-width="2"/>
  <text x="150" y="534" text-anchor="middle" class="fam-label" fill="#6366f1">Analyst-choice</text>

  <rect x="55" y="552" width="190" height="44" rx="8" fill="white" fill-opacity="0.55" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="150" y="570" text-anchor="middle" class="card-name">Perspectival</text>
  <text x="150" y="586" text-anchor="middle" class="card-desc">methods as partial projections</text>

  <rect x="55" y="614" width="190" height="44" rx="8" fill="white" fill-opacity="0.55" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="150" y="632" text-anchor="middle" class="card-name">Contrastive</text>
  <text x="150" y="648" text-anchor="middle" class="card-desc">mechanisms relative to a foil</text>

  <rect x="295" y="552" width="220" height="44" rx="8" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="405" y="570" text-anchor="middle" class="card-name">Cross-method coherence</text>
  <text x="405" y="586" text-anchor="middle" class="card-desc">robust across methods</text>

  <rect x="295" y="614" width="220" height="44" rx="8" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="405" y="632" text-anchor="middle" class="card-name">Same foil set + same pattern</text>
  <text x="405" y="648" text-anchor="middle" class="card-desc">contrastive equivalence</text>

  <rect x="545" y="552" width="220" height="44" rx="8" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="655" y="570" text-anchor="middle" class="card-name">Measurement algebra</text>
  <text x="655" y="586" text-anchor="middle" class="card-desc">operator frames, convergence</text>

  <rect x="545" y="614" width="220" height="44" rx="8" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="655" y="632" text-anchor="middle" class="card-name">Causal graphs</text>
  <text x="655" y="648" text-anchor="middle" class="card-desc">contrastive causal models</text>

  <line x1="245" y1="574" x2="295" y2="574" stroke="#6366f1" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="515" y1="574" x2="545" y2="574" stroke="#6366f1" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="245" y1="636" x2="295" y2="636" stroke="#6366f1" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="515" y1="636" x2="545" y2="636" stroke="#6366f1" stroke-opacity="0.4" stroke-width="2"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- 6. Pragmatic family — Instrumental (bottom)           -->
  <!-- ══════════════════════════════════════════════════════ -->

  <rect x="40" y="694" width="220" height="68" rx="12" fill="#f43f5e" fill-opacity="0.08" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="2"/>
  <text x="150" y="688" text-anchor="middle" class="fam-label" fill="#f43f5e">Pragmatic</text>
  <rect x="55" y="706" width="190" height="44" rx="8" fill="white" fill-opacity="0.55" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="150" y="724" text-anchor="middle" class="card-name">Instrumental</text>
  <text x="150" y="740" text-anchor="middle" class="card-desc">useful predictions, not real objects</text>

  <rect x="295" y="706" width="220" height="44" rx="8" fill="#f43f5e" fill-opacity="0.08" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="405" y="724" text-anchor="middle" class="card-name">Predictive equivalence</text>
  <text x="405" y="740" text-anchor="middle" class="card-desc">same forecast accuracy</text>

  <rect x="545" y="706" width="220" height="44" rx="8" fill="#f43f5e" fill-opacity="0.08" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="655" y="724" text-anchor="middle" class="card-name">Model theory</text>
  <text x="655" y="740" text-anchor="middle" class="card-desc">model classes, loss landscapes</text>

  <line x1="245" y1="728" x2="295" y2="728" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="515" y1="728" x2="545" y2="728" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Bottom tagline -->
  <text x="400" y="790" text-anchor="middle" font-size="14" fill="#475569" font-weight="600" font-style="italic">Ontological commitment determines identity criterion determines formalism.</text>
</svg>
