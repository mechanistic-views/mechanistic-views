<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .layer-name { font-size: 15px; font-weight: 700; fill: #1e293b; }
      .layer-desc { font-size: 14px; font-weight: 600; font-style: italic; fill: #475569; }
      .arrow-label { font-size: 13px; fill: #64748b; font-weight: 600; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Arrow following left-edge slope of pyramid -->
  <line x1="58" y1="474" x2="210" y2="48" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="108" y="250" text-anchor="middle" class="arrow-label" transform="rotate(-69, 108, 250)">Increasing ontological commitment</text>

  <!-- Layer 8 (top, narrowest): Stratified -->
  <rect x="240" y="48" width="360" height="48" rx="10" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.35" stroke-width="2"/>
  <text x="270" y="78" font-size="15" font-weight="700" fill="#1e293b">8.</text>
  <text x="296" y="78" class="layer-name">Stratified</text>
  <text x="590" y="78" text-anchor="end" class="layer-desc">strata with varying identity</text>

  <!-- Layer 7: Structural -->
  <rect x="215" y="102" width="410" height="48" rx="10" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.35" stroke-width="2"/>
  <text x="245" y="132" font-size="15" font-weight="700" fill="#1e293b">7.</text>
  <text x="271" y="132" class="layer-name">Structural</text>
  <text x="615" y="132" text-anchor="end" class="layer-desc">invariant weight structure</text>

  <!-- Layer 6: Process -->
  <rect x="190" y="156" width="460" height="48" rx="10" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="2"/>
  <text x="220" y="186" font-size="15" font-weight="700" fill="#1e293b">6.</text>
  <text x="246" y="186" class="layer-name">Process</text>
  <text x="640" y="186" text-anchor="end" class="layer-desc">formation trajectories</text>

  <!-- Layer 5: Subspace -->
  <rect x="165" y="210" width="510" height="48" rx="10" fill="#14b8a6" fill-opacity="0.08" stroke="#14b8a6" stroke-opacity="0.35" stroke-width="2"/>
  <text x="195" y="240" font-size="15" font-weight="700" fill="#1e293b">5.</text>
  <text x="221" y="240" class="layer-name">Subspace</text>
  <text x="665" y="240" text-anchor="end" class="layer-desc">causal subspaces on Gr(k, d)</text>

  <!-- Layer 4: Object / Role -->
  <rect x="140" y="264" width="560" height="48" rx="10" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.35" stroke-width="2"/>
  <text x="170" y="294" font-size="15" font-weight="700" fill="#1e293b">4.</text>
  <text x="196" y="294" class="layer-name">Object / Role</text>
  <text x="690" y="294" text-anchor="end" class="layer-desc">components and functions</text>

  <!-- Layer 3: Perspectival -->
  <rect x="115" y="318" width="610" height="48" rx="10" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2"/>
  <text x="145" y="348" font-size="15" font-weight="700" fill="#1e293b">3.</text>
  <text x="171" y="348" class="layer-name">Perspectival</text>
  <text x="715" y="348" text-anchor="end" class="layer-desc">methods as partial projections</text>

  <!-- Layer 2: Contrastive -->
  <rect x="90" y="372" width="660" height="48" rx="10" fill="#fb923c" fill-opacity="0.08" stroke="#fb923c" stroke-opacity="0.35" stroke-width="2"/>
  <text x="120" y="402" font-size="15" font-weight="700" fill="#1e293b">2.</text>
  <text x="146" y="402" class="layer-name">Contrastive</text>
  <text x="740" y="402" text-anchor="end" class="layer-desc">foil-relative patterns</text>

  <!-- Layer 1 (bottom, widest): Instrumental -->
  <rect x="65" y="426" width="710" height="48" rx="10" fill="#f43f5e" fill-opacity="0.08" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="2"/>
  <text x="95" y="456" font-size="15" font-weight="700" fill="#1e293b">1.</text>
  <text x="121" y="456" class="layer-name">Instrumental</text>
  <text x="765" y="456" text-anchor="end" class="layer-desc">predictive utility only</text>

  <!-- Bottom tagline -->
  <text x="420" y="510" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-style="italic">Each layer subsumes the ones below. Stronger claims require higher ontological commitment.</text>
</svg>
